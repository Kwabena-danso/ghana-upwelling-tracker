name: Download raw Copernicus Marine data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date/time (ISO 8601)
        required: true
        type: string
        default: "1993-01-01T00:00:00"
      end_date:
        description: End date/time (ISO 8601)
        required: true
        type: string
        default: "2026-09-22T00:00:00"
      minimum_longitude:
        description: Western longitude (degrees)
        required: true
        type: string
        default: "-3.991005"
      minimum_latitude:
        description: Southern latitude (degrees)
        required: true
        type: string
        default: "1.006076"
      maximum_longitude:
        description: Eastern longitude (degrees)
        required: true
        type: string
        default: "2.502319"
      maximum_latitude:
        description: Northern latitude (degrees)
        required: true
        type: string
        default: "6.510059"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Copernicus Marine Toolbox
        run: python -m pip install copernicusmarine

      - name: Download configured raw datasets
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          COPERNICUS_DATASETS_JSON: ${{ vars.COPERNICUS_DATASETS_JSON }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          MINIMUM_LONGITUDE: ${{ inputs.minimum_longitude }}
          MINIMUM_LATITUDE: ${{ inputs.minimum_latitude }}
          MAXIMUM_LONGITUDE: ${{ inputs.maximum_longitude }}
          MAXIMUM_LATITUDE: ${{ inputs.maximum_latitude }}
        run: |
          if [ -z "$COPERNICUS_DATASETS_JSON" ]; then
            echo "Repository variable COPERNICUS_DATASETS_JSON must contain the configured datasets JSON."
            exit 1
          fi
          printf '%s' "$COPERNICUS_DATASETS_JSON" > copernicus-datasets.json
          python fetch_data.py \
            --config copernicus-datasets.json \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --bbox "$MINIMUM_LONGITUDE" "$MINIMUM_LATITUDE" "$MAXIMUM_LONGITUDE" "$MAXIMUM_LATITUDE"

      - name: Save raw NetCDF files
        uses: actions/upload-artifact@v4
        with:
          name: copernicus-raw-data
          path: raw_data/*.nc
          if-no-files-found: error
          retention-days: 14
