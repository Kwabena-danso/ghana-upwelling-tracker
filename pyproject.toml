[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghana-upwelling-tracker"
version = "0.1.0"
description = "Copernicus Marine data acquisition tools for Ghana's upwelling system"
requires-python = ">=3.10"
dependencies = [
    "copernicusmarine",
    "xarray",
    "h5netcdf",
]

[project.scripts]
ghana-upwelling-fetch = "ghana_upwelling.cli:main"
ghana-upwelling-process = "ghana_upwelling.process:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghana_upwelling = ["datasets.json"]
