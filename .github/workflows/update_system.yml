name: Download and process Copernicus Marine data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date/time (ISO 8601)
        required: true
        type: string
        default: "1993-01-01T00:00:00"
      end_date:
        description: End date/time (ISO 8601)
        required: true
        type: string
        default: "2026-09-22T00:00:00"
      dataset_name:
        description: Dataset to download/process
        required: true
        type: choice
        options:
          - sea_surface_height
          - all
        default: sea_surface_height
      minimum_longitude:
        description: Western longitude (degrees)
        required: true
        type: string
        default: "-3.991005"
      minimum_latitude:
        description: Southern latitude (degrees)
        required: true
        type: string
        default: "1.006076"
      maximum_longitude:
        description: Eastern longitude (degrees)
        required: true
        type: string
        default: "2.502319"
      maximum_latitude:
        description: Northern latitude (degrees)
        required: true
        type: string
        default: "6.510059"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and Copernicus Marine Toolbox
        run: python -m pip install .

      - name: Download configured raw datasets
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          MINIMUM_LONGITUDE: ${{ inputs.minimum_longitude }}
          MINIMUM_LATITUDE: ${{ inputs.minimum_latitude }}
          MAXIMUM_LONGITUDE: ${{ inputs.maximum_longitude }}
          MAXIMUM_LATITUDE: ${{ inputs.maximum_latitude }}
          DATASET_NAME: ${{ inputs.dataset_name }}
        run: |
          if [ "$DATASET_NAME" != "all" ]; then
            DATASET_ARGS=(--dataset-name "$DATASET_NAME")
          else
            DATASET_ARGS=()
          fi
          python -m ghana_upwelling \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --bbox "$MINIMUM_LONGITUDE" "$MINIMUM_LATITUDE" "$MAXIMUM_LONGITUDE" "$MAXIMUM_LATITUDE" \
            "${DATASET_ARGS[@]}"

      - name: Inspect downloaded NetCDF datasets
        if: always()
        env:
          DATASET_NAME: ${{ inputs.dataset_name }}
        run: |
          if [ "$DATASET_NAME" = "all" ]; then
            python -m ghana_upwelling.process
          else
            python -m ghana_upwelling.process --dataset-name "$DATASET_NAME"
          fi

      - name: Derive geostrophic velocity from sea-surface height
        run: python -m ghana_upwelling.geostrophic --dashboard-max-time-steps 366

      - name: Save raw NetCDF files
        uses: actions/upload-artifact@v4
        with:
          name: copernicus-raw-data
          path: data/raw/*.nc
          if-no-files-found: error
          retention-days: 14

      - name: Save geostrophic velocity products
        uses: actions/upload-artifact@v4
        with:
          name: geostrophic-velocity
          path: |
            data/processed/geostrophic_velocity.nc
            data/processed/geostrophic_velocity.js
          if-no-files-found: error
          retention-days: 14

      - name: Save dataset quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copernicus-quality-report
          path: data/processed/quality_report.json
          if-no-files-found: error
          retention-days: 14

      - name: Assemble GitHub Pages site
        run: |
          rm -rf site
          mkdir -p site/data/processed
          cp index.html dashboard.css dashboard.js demo_data.js site/
          cp data/processed/geostrophic_velocity.js site/data/processed/
          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: download
    if: needs.download.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
